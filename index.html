<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ongea Ikutoke</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:#fff;font-family:sans-serif}
.header{background:#16a34a;padding:15px;text-align:center;font-size:22px;font-weight:bold;position:sticky;top:0;z-index:10}
.tabs{display:flex;gap:8px;padding:12px;background:#1e293b;position:sticky;top:56px;z-index:10}
.tab{flex:1;padding:14px;border:none;border-radius:10px;background:#334155;color:#fff;font-weight:bold;font-size:16px}
.tab.active{background:#16a34a}
.panel{display:none;padding:16px}
.panel.active{display:block}
textarea,input{width:100%;padding:14px;border-radius:10px;border:none;font-size:16px;margin-bottom:12px}
.btn{width:100%;padding:14px;background:#16a34a;color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:bold}
.post{background:#1e293b;margin:12px;padding:12px;border-radius:10px;word-break:break-word}
.post img,.post video{width:100%;border-radius:8px;margin-top:8px}
.post audio{width:100%;margin-top:8px}
.small{opacity:.6;font-size:12px;margin-top:6px}
h3{margin-bottom:10px}
</style>
</head>
<body>
<div class="header">Ongea Ikutoke 🔥📸🎬🔊</div>

<div class="tabs">
<button class="tab active" onclick="switchTab('text')">Text</button>
<button class="tab" onclick="switchTab('photo')">Photo</button>
<button class="tab" onclick="switchTab('video')">Video</button>
<button class="tab" onclick="switchTab('audio')">Audio</button>
</div>

<div id="textPanel" class="panel active">
<h3>✍️ Text Post</h3>
<textarea id="textInput" rows="4" placeholder="Andika hapa..."></textarea>
<button class="btn" onclick="postText()">Post Text</button>
</div>

<div id="photoPanel" class="panel">
<h3>📸 Photo Post</h3>
<input type="file" id="photoInput" accept="image/*">
<input type="text" id="photoCaption" placeholder="Caption">
<button class="btn" onclick="postPhoto()">
