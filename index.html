<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ongea Ikutoke</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:#fff;font-family:sans-serif}
.header{background:#16a34a;padding:15px;text-align:center;font-size:22px;font-weight:bold;position:sticky;top:0;z-index:10}
.tabs{display:flex;gap:8px;padding:12px;background:#1e293b;position:sticky;top:56px;z-index:10}
.tab{flex:1;padding:14px;border:none;border-radius:10px;background:#334155;color:#fff;font-weight:bold;font-size:16px}
.tab.active{background:#16a34a}
.panel{display:none;padding:16px}
.panel.active{display:block}
textarea,input{width:100%;padding:14px;border-radius:10px;border:none;font-size:16px;margin-bottom:12px}
.btn{width:100%;padding:14px;background:#16a34a;color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:bold}
.post{background:#1e293b;margin:12px;padding:12px;border-radius:10px;word-break:break-word}
.post img,.post video{width:100%;border-radius:8px;margin-top:8px}
.post audio{width:100%;margin-top:8px}
.small{opacity:.6;font-size:12px;margin-top:6px}
h3{margin-bottom:10px}
</style>
</head>
<body>
<div class="header">Ongea Ikutoke 🔥📸🎬🔊</div>
<div class="tabs">
<button class="tab active" onclick="switchTab('text')">Text</button>
<button class="tab" onclick="switchTab('photo')">Photo</button>
<button class="tab" onclick="switchTab('video')">Video</button>
<button class="tab" onclick="switchTab('audio')">Audio</button>
</div>
<div id="textPanel" class="panel active">
<h3>✍️ Text Post</h3>
<textarea id="textInput" rows="4" placeholder="Andika hapa..."></textarea>
<button class="btn" onclick="postText()">Post Text</button>
</div>
<div id="photoPanel" class="panel">
<h3>📸 Photo Post</h3>
<input type="file" id="photoInput" accept="image/*">
<input type="text" id="photoCaption" placeholder="Caption">
<button class="btn" onclick="postPhoto()">Post Photo</button>
</div>
<div id="videoPanel" class="panel">
<h3>🎬 Video Post</h3>
<input type="file" id="videoInput" accept="video/*">
<input type="text" id="videoCaption" placeholder="Caption">
<button class="btn" onclick="postVideo()">Post Video</button>
</div>
<div id="audioPanel" class="panel">
<h3>🔊 Audio Post</h3>
<input type="file" id="audioInput" accept="audio/*">
<input type="text" id="audioCaption" placeholder="Caption">
<button class="btn" onclick="postAudio()">Post Audio</button>
</div>
<div id="feed"></div>
<script>
let posts=JSON.parse(localStorage.getItem('ongea_posts')||'[]');
function switchTab(n){
document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
const m={text:0,photo:1,video:2,audio:3};
document.querySelectorAll('.tab')[m[n]].classList.add('active');
document.getElementById(n+'Panel').classList.add('active');
}
function save(){localStorage.setItem('ongea_posts',JSON.stringify(posts));render()}
function render(){
let f=document.getElementById('feed');f.innerHTML='';
posts.slice().reverse().forEach(p=>{
let h=`<div class="post"><div>${p.caption||p.text||''}</div>`;
if(p.type==='photo')h+=`<img src="${p.data}">`;
if(p.type==='video')h+=`<video controls src="${p.data}"></video>`;
if(p.type==='audio')h+=`<audio controls src="${p.data}"></audio>`;
h+=`<div class="small">${p.time}</div></div>`;
f.innerHTML+=h;
});
}
function postText(){
let t=document.getElementById('textInput').value.trim();
if(!t)return alert('Andika kitu');
posts.push({type:'text',text:t,time:new Date().toLocaleString()});
document.getElementById('textInput').value='';save();
}
function postFile(inp,cap,type){
let file=document.getElementById(inp).files[0];
if(!file)return alert('Chagua file');
let c=document.getElementById(cap).value;
let r=new FileReader();
r.onload=e=>{posts.push({type:type,caption:c,data:e.target.result,time:new Date().toLocaleString()});save()};
r.readAsDataURL(file);
}
function postPhoto(){postFile('photoInput','photoCaption','photo')}
function postVideo(){postFile('videoInput','videoCaption','video')}
function postAudio(){postFile('audioInput','audioCaption','audio')}
render();
</script>
</body>
                 </html>
